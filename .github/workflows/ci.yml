name: ci

on:
  pull_request:

permissions:
  contents: read

jobs:
  gate:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Warm Chrome
        # Chrome's first start on a fresh runner took up to ~13 s inside e2e (F2);
        # this one runs in the background while Go is fetched and the gate runs.
        run: (google-chrome --headless=new --no-sandbox --disable-gpu --dump-dom about:blank > /dev/null 2>&1 &)
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Go 1.27.0
        # setup-go spent ~4 s copying Go into the tool cache on every run (F2).
        run: |
          curl -fsSL -o "$RUNNER_TEMP/go.tgz" https://go.dev/dl/go1.27.0.linux-amd64.tar.gz
          echo "675c26c449cbb18fc24b74650de1eabbae6e16f64326fd85a283fb3b58280685  $RUNNER_TEMP/go.tgz" | sha256sum -c --quiet
          tar -C "$RUNNER_TEMP" -xzf "$RUNNER_TEMP/go.tgz"
          echo "$RUNNER_TEMP/go/bin" >> "$GITHUB_PATH"
          echo "GOTOOLCHAIN=local" >> "$GITHUB_ENV"
      - name: Cache key
        # Keyed on go.sum alone, the cache kept what the gate built when it was
        # first saved, and every import added since was rebuilt on each run (F5):
        # the key also covers each package's imports and the Makefile.
        id: deps
        run: |
          imports=$(git ls-files -z '*.go' | xargs -0 awk '/^import \(/ { f = 1 } f || /^import "/ { d = FILENAME; sub(/\/[^\/]*$/, "", d); print d, $0 } /^\)/ { f = 0 }' | sort -u)
          echo "hash=$(echo "$imports" | cat go.sum Makefile - | sha256sum | cut -c1-16)" >> "$GITHUB_OUTPUT"
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.cache/go-build
            ~/go/pkg/mod
          key: go-1.27.0-${{ steps.deps.outputs.hash }}
          restore-keys: go-1.27.0-
      - name: Gate and browser checks
        run: make -j8 --output-sync=target NICE="nice -n 10" gate e2e
