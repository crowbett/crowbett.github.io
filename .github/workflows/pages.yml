name: pages

# One job so deploy does not wait for a second runner; CI must stay under 60 s.
on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Go 1.27.0
        # setup-go spent ~4 s copying Go into the tool cache on every run (F2).
        run: |
          curl -fsSL -o "$RUNNER_TEMP/go.tgz" https://go.dev/dl/go1.27.0.linux-amd64.tar.gz
          echo "675c26c449cbb18fc24b74650de1eabbae6e16f64326fd85a283fb3b58280685  $RUNNER_TEMP/go.tgz" | sha256sum -c --quiet
          tar -C "$RUNNER_TEMP" -xzf "$RUNNER_TEMP/go.tgz"
          echo "$RUNNER_TEMP/go/bin" >> "$GITHUB_PATH"
          echo "GOTOOLCHAIN=local" >> "$GITHUB_ENV"
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.cache/go-build
            ~/go/pkg/mod
          key: go-1.27.0-${{ hashFiles('go.sum') }}
      - name: Gate and browser checks
        run: make -j4 --output-sync=target gate e2e
      - uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: dist
      - id: deploy
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1
